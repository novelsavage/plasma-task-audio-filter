name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Qt bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-pyqt6.qtquick
      - name: Test schema types and application filters
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
